name: ci

# 中国象棋（Qt 6 / C++ QML）：Linux + Windows 构建与测试
# 每次 push / PR 触发；Qt 安装目录缓存加速（actions/cache）
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  # ============ Linux 测试（Ubuntu 24.04 + aqt Qt 6.8.3）============
  linux-test:
    name: Linux 测试（Qt 6.8.3）
    runs-on: ubuntu-24.04
    env:
      QT_DIR: /opt/qt
      QT_ARCH: linux_gcc_64
      QT_PREFIX: /opt/qt/6.8.3/gcc_64
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Qt（命中则跳过安装，加速构建）
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake build-essential \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-image0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xfixes0-dev \
            libxcb-cursor-dev libxcb-shm0-dev libxcb-util-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxcb-cursor0 file

      - name: 安装 Qt（缓存未命中时才安装）
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --upgrade pip aqtinstall
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} -O ${{ env.QT_DIR }}

      - name: 配置与构建（Ninja）
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.QT_PREFIX }}
          cmake --build build -j $(nproc)

      - name: 单元测试（CTest 规则测试）
        run: ctest --test-dir build --output-on-failure

      - name: 冒烟测试（offscreen + 软件渲染，正常运行至超时即通过）
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 10 ./build/xiangqi-qt
          code=$?
          set -e
          if [ $code -eq 124 ]; then
            echo "SMOKE_OK（程序正常运行至超时）"
          else
            echo "SMOKE_FAIL（exit=$code）"
            exit 1
          fi

      - name: 上传测试产物（可选，调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-bin
          path: build/xiangqi-qt
          retention-days: 1

  # ============ Windows 测试（windows-latest + MSVC + aqt Qt 6.8.3）============
  windows-test:
    name: Windows 测试（Qt 6.8.3）
    runs-on: windows-latest
    env:
      QT_DIR: C:/qt
      QT_ARCH: win64_msvc2022_64
      QT_PREFIX: C:/qt/6.8.3/msvc2022_64
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Qt（命中则跳过安装，加速构建）
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: 安装 Qt（缓存未命中时才安装）
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} -O ${{ env.QT_DIR }}

      - name: 激活 MSVC 环境（自动定位 VS，兼容 2022/2026）
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置与构建（Ninja + MSVC）
        shell: bash
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.QT_PREFIX }}
          cmake --build build

      - name: 单元测试（CTest 规则测试）
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: 冒烟测试（offscreen，进程存活即通过）
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = ".\build\xiangqi-qt.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            Write-Error "SMOKE_FAIL：进程提前退出，exit=$($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "SMOKE_OK（进程存活 6 秒，启动正常）"

      - name: 上传测试产物（可选，调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-bin
          path: build/xiangqi-qt.exe
          retention-days: 1

  # ============ macOS 测试（macos-latest + aqt Qt 6.8.3 macos_arm64）============
  macos-test:
    name: macOS 测试（Qt 6.8.3）
    runs-on: macos-latest
    env:
      QT_DIR: /Users/runner/qt
      QT_ARCH: clang_64
      QT_PREFIX: /Users/runner/qt/6.8.3/macos
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Qt（命中则跳过安装，加速构建）
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: ${{ runner.os }}-qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: 安装 Qt（缓存未命中时才安装）
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages --upgrade pip aqtinstall
          python3 -m aqt install-qt mac desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} -O ${{ env.QT_DIR }}

      - name: 配置与构建（Ninja）
        run: |
          # 诊断：SDK 与 Qt6Gui 配置中的 AGL 引用（留档）
          echo "== SDK 路径 =="
          xcrun --show-sdk-path
          echo "== SDK 中 AGL 查找 =="
          find "$(xcrun --show-sdk-path)" -iname "*AGL*" 2>/dev/null | head -3 || true
          echo "== Qt6GuiConfig 中 AGL 引用 =="
          grep -rn "AGL" ${{ env.QT_PREFIX }}/lib/cmake/Qt6Gui/Qt6GuiConfig.cmake 2>/dev/null | head -5 || true
          # Xcode 16+ SDK 已移除 AGL.framework，而 Qt 6.8 的 Qt6::Gui 仍引用
          # "-framework AGL"，导致链接失败。在用户目录创建最小 stub，
          # 并通过 CMAKE_EXE_LINKER_FLAGS 的 -F 显式加入搜索路径
          # （Qt 6.8 在 macOS 上实际使用 Metal 渲染，不调用 AGL 符号）。
          AGL="$HOME/agl/AGL.framework"
          mkdir -p "$AGL/Versions/A"
          printf 'int _agl_stub_dummy = 1;\n' > /tmp/agl_stub.c
          cc -dynamiclib -Wl,-install_name,@rpath/AGL.framework/Versions/A/AGL \
            -o "$AGL/Versions/A/AGL" /tmp/agl_stub.c
          cd "$AGL"
          ln -sfn A Versions/Current
          ln -sfn Versions/Current/AGL AGL
          ls -la "$AGL" "$AGL/Versions"
          echo "AGL_STUB_READY: $AGL"
          cd "$GITHUB_WORKSPACE"
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.QT_PREFIX }} \
            -DCMAKE_EXE_LINKER_FLAGS="-F$HOME/agl"
          cmake --build build

      - name: 单元测试（CTest 规则测试）
        run: ctest --test-dir build --output-on-failure

      - name: 冒烟测试（offscreen + 软件渲染，进程存活即通过）
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ./build/xiangqi-qt &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then
            kill $PID 2>/dev/null
            echo "SMOKE_OK（程序正常运行 10 秒）"
            set -e
            exit 0
          fi
          wait $PID
          CODE=$?
          echo "SMOKE_FAIL（exit=$CODE）"
          set -e
          exit 1

      - name: 上传测试产物（可选，调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-bin
          path: build/xiangqi-qt
          retention-days: 1
